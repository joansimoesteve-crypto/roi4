<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Valora tu experiencia — Avatar Roi</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font:18px/1.5 system-ui,sans-serif;background:#fbf7ec;color:#26331f}
h1{font-size:clamp(30px,7vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px}p{color:#5b6a50;max-width:34ch;margin:0 auto}small{display:block;margin-top:28px;color:#7a866f}</style></head>
<body><main><h1 id="t">Valora tu experiencia</h1><p>Toca a Roi, abajo a la derecha. Son 20 segundos y no necesitas instalar nada.</p><small>Avatar Roi · tu opinión mejora ciudades, empresas e instituciones</small></main>
<script>
const q=new URLSearchParams(location.search),n=(q.get('n')||'').slice(0,80),t=['place','web','org'].includes(q.get('t'))?q.get('t'):'place';
if(n){window.ROI_CONTEXT={name:n,type:t};document.getElementById('t').textContent='¿Cómo ha sido tu experiencia en '+n+'?';document.title='Valora '+n}
</script><script src="avatar.js" data-open="1"></script></body></html>
